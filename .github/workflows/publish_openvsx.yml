on:
  push:
    tags:
      - "*"
name: Deploy Extension VSX
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v1
        id: publishToOVSX
        with:
          pat: ${{ secrets.OVSX_TOKEN }}
